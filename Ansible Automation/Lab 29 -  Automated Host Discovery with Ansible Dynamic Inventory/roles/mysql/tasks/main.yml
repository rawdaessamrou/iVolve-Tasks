---
- name: Import MySQL GPG key
  ansible.builtin.rpm_key:
    key: https://repo.mysql.com/RPM-GPG-KEY-mysql-2025
    state: present

- name: Add MySQL 8.0 Community yum repo
  ansible.builtin.yum_repository:
    name: mysql80-community
    description: MySQL 8.0 Community Server
    baseurl: https://repo.mysql.com/yum/mysql-8.0-community/el/9/$basearch/
    gpgcheck: true
    gpgkey: https://repo.mysql.com/RPM-GPG-KEY-mysql-2025
    enabled: true

- name: Remove conflicting MariaDB packages if present
  ansible.builtin.dnf:
    name:
      - mariadb105
      - mariadb105-server
    state: absent
  ignore_errors: true

- name: Install MySQL Community Server
  ansible.builtin.dnf:
    name: mysql-community-server
    state: present

- name: Ensure MySQL is running and enabled
  ansible.builtin.service:
    name: mysqld
    state: started
    enabled: true
